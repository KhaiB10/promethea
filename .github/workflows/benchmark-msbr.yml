name: benchmark-msbr

# v0.4.0 first-light: run the MSBR unit-cell k_inf in CI, plus a cheap
# 'plot' mode that emits PNGs of the unit cell and full-core geometry
# without running OpenMC transport.
#
# Mirrors benchmark-msre's structure (XS cache + Docker buildx + result
# extraction in the workflow summary) so multi-seed envelopes work the
# same way.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "MSBR mode: plot, unit_cell, homog_cell, het_vs_homog, temp_sweep, vf_sweep, or spectrum"
        required: false
        default: "plot"
        type: choice
        options:
          - plot
          - unit_cell
          - homog_cell
          - het_vs_homog
          - temp_sweep
          - vf_sweep
          - spectrum
      vf_grid:
        description: "vf_sweep grid: coarse (3x3), fine (5x5), single (ORNL smoke), or corner (Δk-max reproduction)"
        required: false
        default: "coarse"
        type: choice
        options:
          - coarse
          - fine
          - single
          - corner
      temp_lo_K:
        description: "Low temperature in K for temp_sweep (default 900)"
        required: false
        default: "900"
      temp_hi_K:
        description: "High temperature in K for temp_sweep (default 1200)"
        required: false
        default: "1200"
      particles:
        description: "Particles per batch (default 20000)"
        required: false
        default: "20000"
      batches:
        description: "Total batches (default 60)"
        required: false
        default: "60"
      xs_library:
        description: "Cross-section library"
        required: false
        default: "endfb-viii.0"
        type: choice
        options:
          - endfb-viii.0
          - endfb-vii.1
          - jeff-3.3
      seed:
        description: "OpenMC RNG seed (positive int). Empty = OpenMC default (seed=1)."
        required: false
        default: ""
  # Path-filtered auto-trigger so MSBR code changes are exercised on push
  # without firing on every commit.
  push:
    branches: [main]
    paths:
      - "benchmarks/msbr/**"
      - ".github/workflows/benchmark-msbr.yml"
      - "Dockerfile"
      - "environment.yml"

permissions:
  contents: read

concurrency:
  group: msbr-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.mode || 'plot' }}-${{ github.event.inputs.xs_library || 'endfb-viii.0' }}-${{ github.event.inputs.seed || 'default' }}
  cancel-in-progress: true

jobs:
  msbr-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # ---- 0. Free disk space ---------------------------------------------
      # GitHub-hosted ubuntu runners ship with ~14 GB of preinstalled
      # tooling we don't need (Android, .NET, Haskell, CodeQL caches,
      # etc.). Removing them gives Docker buildx room to write its
      # layer cache without 'no space left on device' errors.
      - name: Free runner disk
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      # ---- 1. Resolve and restore the XS library --------------------------
      - name: Resolve library paths
        id: xs-paths
        env:
          XS_LIB: ${{ github.event.inputs.xs_library || 'endfb-viii.0' }}
        run: |
          XS_LIB="${XS_LIB:-endfb-viii.0}"
          case "$XS_LIB" in
            endfb-viii.0) DIRNAME="endfb-viii.0-hdf5" ;;
            endfb-vii.1)  DIRNAME="endfb-vii.1-hdf5" ;;
            jeff-3.3)     DIRNAME="jeff-3.3-hdf5" ;;
            *) echo "Unknown xs_library: $XS_LIB"; exit 1 ;;
          esac
          echo "xs_lib=$XS_LIB" >> "$GITHUB_OUTPUT"
          echo "xs_dirname=$DIRNAME" >> "$GITHUB_OUTPUT"
          echo "xs_xml=data/xs/$DIRNAME/cross_sections.xml" >> "$GITHUB_OUTPUT"

      # Auto-trigger pushes always run plot mode (no XS download, no
      # transport). Manual dispatches honor the 'mode' input.
      - name: Resolve effective mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "effective=plot" >> "$GITHUB_OUTPUT"
          else
            echo "effective=${{ github.event.inputs.mode || 'plot' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache cross-section library
        if: ${{ steps.mode.outputs.effective != 'plot' }}
        id: xs-cache
        uses: actions/cache@v4
        with:
          path: data/xs/${{ steps.xs-paths.outputs.xs_dirname }}
          key: ${{ steps.xs-paths.outputs.xs_dirname }}-v1

      - name: Fetch cross-sections (if cache miss and mode != plot)
        if: ${{ steps.mode.outputs.effective != 'plot' && steps.xs-cache.outputs.cache-hit != 'true' }}
        run: bash scripts/fetch_xs.sh ${{ steps.xs-paths.outputs.xs_lib }}

      - name: Prepare working directories
        run: |
          sudo chmod -R a+rX data/xs 2>/dev/null || true
          mkdir -p sims/openmc out out/plots/msbr
          sudo chmod -R a+rwX sims out

      # ---- 2. Build Docker image ------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Promethea image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: promethea:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 3a. Plot mode --------------------------------------------------
      - name: Generate MSBR geometry plots
        if: ${{ steps.mode.outputs.effective == 'plot' }}
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python -m benchmarks.msbr.plot_geometry 2>&1 | tee out/msbr_plot.log
          ls -lh out/plots/msbr/ || true

      # ---- 3b. Heterogeneous unit-cell k_inf ------------------------------
      - name: Run MSBR unit-cell k_inf (heterogeneous)
        if: ${{ steps.mode.outputs.effective == 'unit_cell' || steps.mode.outputs.effective == 'het_vs_homog' }}
        env:
          PARTICLES: ${{ github.event.inputs.particles || '20000' }}
          BATCHES: ${{ github.event.inputs.batches || '60' }}
          XS_XML: ${{ steps.xs-paths.outputs.xs_xml }}
          SEED: ${{ github.event.inputs.seed || '' }}
        run: |
          SEED_ENV=()
          if [ -n "$SEED" ]; then
            SEED_ENV=(-e PROMETHEA_SEED="$SEED")
          fi
          docker run --rm \
            -v $PWD:/workspace \
            -e OPENMC_CROSS_SECTIONS=/workspace/$XS_XML \
            -e PROMETHEA_PARTICLES=$PARTICLES \
            -e PROMETHEA_BATCHES=$BATCHES \
            "${SEED_ENV[@]}" \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python -m benchmarks.msbr.run_unit_cell 2>&1 | tee out/msbr_run.log

      # ---- 3c. Homogenized unit-cell k_inf --------------------------------
      - name: Run MSBR homogenized-cell k_inf
        if: ${{ steps.mode.outputs.effective == 'homog_cell' || steps.mode.outputs.effective == 'het_vs_homog' }}
        env:
          PARTICLES: ${{ github.event.inputs.particles || '20000' }}
          BATCHES: ${{ github.event.inputs.batches || '60' }}
          XS_XML: ${{ steps.xs-paths.outputs.xs_xml }}
          SEED: ${{ github.event.inputs.seed || '' }}
        run: |
          SEED_ENV=()
          if [ -n "$SEED" ]; then
            SEED_ENV=(-e PROMETHEA_SEED="$SEED")
          fi
          docker run --rm \
            -v $PWD:/workspace \
            -e OPENMC_CROSS_SECTIONS=/workspace/$XS_XML \
            -e PROMETHEA_PARTICLES=$PARTICLES \
            -e PROMETHEA_BATCHES=$BATCHES \
            "${SEED_ENV[@]}" \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python -m benchmarks.msbr.run_homog_cell 2>&1 | tee out/msbr_homog_run.log

      # ---- 3e. Temperature sweep -----------------------------------------
      - name: Run MSBR temperature sweep
        if: ${{ steps.mode.outputs.effective == 'temp_sweep' }}
        env:
          PARTICLES: ${{ github.event.inputs.particles || '20000' }}
          BATCHES: ${{ github.event.inputs.batches || '60' }}
          XS_XML: ${{ steps.xs-paths.outputs.xs_xml }}
          SEED: ${{ github.event.inputs.seed || '' }}
          TEMP_LO: ${{ github.event.inputs.temp_lo_K || '900' }}
          TEMP_HI: ${{ github.event.inputs.temp_hi_K || '1200' }}
        run: |
          SEED_ENV=()
          if [ -n "$SEED" ]; then
            SEED_ENV=(-e PROMETHEA_SEED="$SEED")
          fi
          docker run --rm \
            -v $PWD:/workspace \
            -e OPENMC_CROSS_SECTIONS=/workspace/$XS_XML \
            -e PROMETHEA_PARTICLES=$PARTICLES \
            -e PROMETHEA_BATCHES=$BATCHES \
            -e PROMETHEA_TEMP_LO_K=$TEMP_LO \
            -e PROMETHEA_TEMP_HI_K=$TEMP_HI \
            "${SEED_ENV[@]}" \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python -m benchmarks.msbr.run_temp_sweep 2>&1 | tee out/msbr_temp_sweep.log

      # ---- 3f. Volume-fraction sweep --------------------------------------
      - name: Run MSBR volume-fraction sweep
        if: ${{ steps.mode.outputs.effective == 'vf_sweep' }}
        env:
          PARTICLES: ${{ github.event.inputs.particles || '50000' }}
          BATCHES: ${{ github.event.inputs.batches || '120' }}
          XS_XML: ${{ steps.xs-paths.outputs.xs_xml }}
          SEED: ${{ github.event.inputs.seed || '1' }}
          VF_GRID: ${{ github.event.inputs.vf_grid || 'coarse' }}
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -e OPENMC_CROSS_SECTIONS=/workspace/$XS_XML \
            -e PROMETHEA_PARTICLES=$PARTICLES \
            -e PROMETHEA_BATCHES=$BATCHES \
            -e PROMETHEA_SEED=$SEED \
            -e PROMETHEA_VF_GRID=$VF_GRID \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python -m benchmarks.msbr.run_vf_sweep 2>&1 | tee out/msbr_vf_sweep.log

      # ---- 3g. Spectral decomposition -------------------------------------
      - name: Run MSBR spectral decomposition
        if: ${{ steps.mode.outputs.effective == 'spectrum' }}
        env:
          PARTICLES: ${{ github.event.inputs.particles || '50000' }}
          BATCHES: ${{ github.event.inputs.batches || '120' }}
          XS_XML: ${{ steps.xs-paths.outputs.xs_xml }}
          SEED: ${{ github.event.inputs.seed || '1' }}
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -e OPENMC_CROSS_SECTIONS=/workspace/$XS_XML \
            -e PROMETHEA_PARTICLES=$PARTICLES \
            -e PROMETHEA_BATCHES=$BATCHES \
            -e PROMETHEA_SEED=$SEED \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python -m benchmarks.msbr.run_spectrum 2>&1 | tee out/msbr_spectrum.log

      # ---- 3d. Het vs homog comparison ------------------------------------
      - name: Compare het vs homog
        if: ${{ steps.mode.outputs.effective == 'het_vs_homog' }}
        run: |
          HET_SP=$(ls sims/openmc/msbr_unit_cell/statepoint.*.h5 | tail -1)
          HOMOG_SP=$(ls sims/openmc/msbr_homog_cell/statepoint.*.h5 | tail -1)
          docker run --rm \
            -v $PWD:/workspace \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python scripts/analysis/het_vs_homog.py \
              --het "$HET_SP" --homog "$HOMOG_SP" \
              --out out/het_vs_homog.json 2>&1 | tee out/het_vs_homog.log

      # ---- 4. Surface results ---------------------------------------------
      - name: Write summary
        if: always()
        run: |
          {
            echo "## MSBR v0.4.0 first-light"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA:0:7}\`"
            echo "**Mode (effective):** ${{ steps.mode.outputs.effective }}"
            echo "**Cross-section library:** \`${{ github.event.inputs.xs_library || 'endfb-viii.0' }}\`"
            echo "**Seed:** \`${{ github.event.inputs.seed || '(default)' }}\`"
            echo ""
            MODE="${{ steps.mode.outputs.effective }}"
            if [ "$MODE" = "unit_cell" ]; then
              echo "### k_inf (heterogeneous)"
              echo '```'
              grep -E "(k-eff|k-effective|combined)" out/msbr_run.log | tail -20 \
                || echo "(no k-eff lines — see artifact)"
              echo '```'
            elif [ "$MODE" = "homog_cell" ]; then
              echo "### k_inf (homogenized)"
              echo '```'
              grep -E "(k-eff|k-effective|combined)" out/msbr_homog_run.log | tail -20 \
                || echo "(no k-eff lines — see artifact)"
              echo '```'
            elif [ "$MODE" = "het_vs_homog" ]; then
              echo "### Heterogeneity study"
              echo '```'
              cat out/het_vs_homog.log 2>/dev/null \
                || echo "(no comparison output — see artifact)"
              echo '```'
            elif [ "$MODE" = "temp_sweep" ]; then
              echo "### Temperature coefficient (two-point FD)"
              echo '```'
              tail -25 out/msbr_temp_sweep.log 2>/dev/null \
                || echo "(no temp-sweep output — see artifact)"
              echo '```'
            elif [ "$MODE" = "vf_sweep" ]; then
              echo "### Volume-fraction sweep"
              echo '```'
              tail -50 out/msbr_vf_sweep.log 2>/dev/null \
                || echo "(no vf_sweep output — see artifact)"
              echo '```'
            elif [ "$MODE" = "spectrum" ]; then
              echo "### Spectral decomposition"
              echo '```'
              tail -60 out/msbr_spectrum.log 2>/dev/null \
                || echo "(no spectrum output — see artifact)"
              echo '```'
            else
              echo "### Geometry plots"
              ls out/plots/msbr/ 2>/dev/null | sed 's/^/- /' || echo "(no plots)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbr-${{ github.event.inputs.mode || 'plot' }}-${{ github.event.inputs.xs_library || 'endfb-viii.0' }}-seed${{ github.event.inputs.seed || 'default' }}-run-${{ github.run_number }}
          path: |
            out/
            sims/openmc/msbr_*/
          if-no-files-found: warn
          retention-days: 30
