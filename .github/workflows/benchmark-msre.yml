name: benchmark-msre

# Runs the MSRE homogenized v0 criticality benchmark in CI.
#
# Strategy
#   1. Cache the ENDF/B-VIII.0 cross-section archive (~4 GB) so we only
#      download it once per cache lifetime (GitHub keeps caches for 7 days
#      after last use, max 10 GB per repo).
#   2. Build the Docker image (also cached via GHA's build cache).
#   3. Run benchmarks/msre/run_criticality.py inside the container.
#   4. Surface k-eff in the workflow summary so it's readable from a phone.
#
# Runtime expectations on the free ubuntu-latest runner (4 vCPU / 16 GB):
#   - First run (cold cache):  ~45-75 min  (XS download dominates)
#   - Warm runs:               ~20-35 min
#
# Triggered manually OR on changes to MSRE benchmark code.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Geometry mode: homog (v0), het (v1), or het_clipped (v1c)"
        required: false
        default: "homog"
        type: choice
        options:
          - homog
          - het
          - het_clipped
      particles:
        description: "Particles per batch (default 50000; reduce to 10000 for a fast smoke run)"
        required: false
        default: "50000"
      batches:
        description: "Total batches (default 120)"
        required: false
        default: "120"
  push:
    paths:
      - "benchmarks/msre/**"
      - "Dockerfile"
      - "environment.yml"
      - ".github/workflows/benchmark-msre.yml"

# Cancel superseded runs to save minutes.
concurrency:
  group: msre-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msre-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # ---- 1. Restore cross-section cache --------------------------------
      - name: Cache ENDF/B-VIII.0 cross-sections
        id: xs-cache
        uses: actions/cache@v4
        with:
          path: data/xs
          # Bump the version suffix to invalidate the cache.
          key: endfb-viii.0-hdf5-v1

      - name: Fetch cross-sections (if cache miss)
        if: steps.xs-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch_xs.sh

      - name: Confirm cross-sections present and make them container-readable
        run: |
          ls -lh data/xs/endfb-viii.0-hdf5/cross_sections.xml
          echo "XS dir size: $(du -sh data/xs | cut -f1)"
          # The Docker container runs as mambauser (non-root). Ensure the
          # mounted XS tree is world-readable and dirs are world-executable.
          sudo chmod -R a+rX data/xs
          # Also ensure the working tree is writeable so OpenMC can write
          # statepoint files back to the host through the bind mount.
          mkdir -p sims/openmc out
          sudo chmod -R a+rwX sims out

      # ---- 2. Build Docker image (with layer cache) -----------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Promethea image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: promethea:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 3. Run the MSRE benchmark --------------------------------------
      - name: Run MSRE benchmark
        id: run
        env:
          PARTICLES: ${{ github.event.inputs.particles || '50000' }}
          BATCHES: ${{ github.event.inputs.batches || '120' }}
          MODE: ${{ github.event.inputs.mode || 'homog' }}
        run: |
          mkdir -p out
          docker run --rm \
            -v $PWD:/workspace \
            -e OPENMC_CROSS_SECTIONS=/workspace/data/xs/endfb-viii.0-hdf5/cross_sections.xml \
            -e PROMETHEA_PARTICLES=$PARTICLES \
            -e PROMETHEA_BATCHES=$BATCHES \
            -e PROMETHEA_MODE=$MODE \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python benchmarks/msre/run_criticality.py 2>&1 | tee out/msre_run.log

      # ---- 4. Surface results in the GitHub UI ----------------------------
      - name: Extract k-eff and write summary
        if: always()
        run: |
          {
            echo "## MSRE benchmark — results"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA:0:7}\`"
            echo "**Mode:** ${{ github.event.inputs.mode || 'homog' }}"
            echo "**Particles/batch:** ${{ github.event.inputs.particles || '50000' }}"
            echo "**Batches:** ${{ github.event.inputs.batches || '120' }}"
            echo ""
            echo "### k-eff"
            echo '```'
            grep -E "(k-eff|k-effective|PASS|FAIL|Final k|combined)" out/msre_run.log | tail -20 || echo "(no k-eff lines found — see artifact)"
            echo '```'
            echo ""
            echo "### Tail of run log"
            echo '```'
            tail -40 out/msre_run.log
            echo '```'
            echo ""
            echo "### Acceptance envelopes"
            echo "- v0 (homogenized) envelope: \`1.00 <= k <= 1.15\`"
            echo "- v1 (heterogeneous, IRPhE salt, rods withdrawn) envelope: \`0.98 <= k <= 1.05\`, target \`~1.020\`"
            echo "- v1c (het + edge-stringer clipping) envelope: \`0.98 <= k <= 1.05\`, target \`~1.020\`"
            echo "- IRPhE experimental k-eff: \`0.99978\` (rods inserted to critical)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msre-${{ github.event.inputs.mode || 'homog' }}-run-${{ github.run_number }}
          path: |
            out/
            sims/openmc/msre_*/statepoint.*.h5
            sims/openmc/msre_*/tallies.out
            sims/openmc/msre_*/summary.h5
          if-no-files-found: warn
          retention-days: 30
