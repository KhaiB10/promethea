name: benchmark-msre

# Runs the MSRE homogenized v0 criticality benchmark in CI.
#
# Strategy
#   1. Cache the ENDF/B-VIII.0 cross-section archive (~4 GB) so we only
#      download it once per cache lifetime (GitHub keeps caches for 7 days
#      after last use, max 10 GB per repo).
#   2. Build the Docker image (also cached via GHA's build cache).
#   3. Run benchmarks/msre/run_criticality.py inside the container.
#   4. Surface k-eff in the workflow summary so it's readable from a phone.
#
# Runtime expectations on the free ubuntu-latest runner (4 vCPU / 16 GB):
#   - First run (cold cache):  ~45-75 min  (XS download dominates)
#   - Warm runs:               ~20-35 min
#
# Triggered manually OR on changes to MSRE benchmark code.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Geometry mode: homog, het, het_clipped, het_lh, het_can, het_rods_out, het_baskets, het_critical, or 'plot' for geometry-verification PNGs only (no simulation)"
        required: false
        default: "homog"
        type: choice
        options:
          - homog
          - het
          - het_clipped
          - het_lh
          - het_can
          - het_rods_out
          - het_baskets
          - het_critical
          - plot
      particles:
        description: "Particles per batch (default 50000; reduce to 10000 for a fast smoke run)"
        required: false
        default: "50000"
      batches:
        description: "Total batches (default 120)"
        required: false
        default: "120"
      boron_ppm:
        description: "CGB graphite boron impurity (ppm, total natural B). Default 0.3 (MSRE-Mark-I spec); sweep range 0.1-1.0."
        required: false
        default: "0.3"
      fillet_radius_cm:
        description: "Half-channel inner-corner fillet radius (cm). 0 = sharp corners (Phase 1.1.c/d-step1); 0.475 = TM-730 0.225 fuel-fraction target."
        required: false
        default: "0.0"
      xs_library:
        description: "Cross-section library: endfb-viii.0 (baseline), endfb-vii.1 (Shen comparison), jeff-3.3 (independent)."
        required: false
        default: "endfb-viii.0"
        type: choice
        options:
          - endfb-viii.0
          - endfb-vii.1
          - jeff-3.3
      basket_shell:
        description: "INOR-8 shell on the sample-basket position. true = Phase 1.1.c default, false = TM-730 §4.1 'graphite sample assembly' (Suspect-1 audit)."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    paths:
      - "benchmarks/msre/**"
      - "Dockerfile"
      - "environment.yml"
      - ".github/workflows/benchmark-msre.yml"

# Cancel superseded runs to save minutes. Group by ref + dispatched
# inputs so independent sweep dispatches (e.g. different boron_ppm)
# queue instead of preempt each other, while repeated pushes still
# cancel stale default runs on the same ref.
concurrency:
  group: msre-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.mode || 'homog' }}-${{ github.event.inputs.boron_ppm || '0.3' }}-${{ github.event.inputs.fillet_radius_cm || '0.0' }}-${{ github.event.inputs.xs_library || 'endfb-viii.0' }}-${{ github.event.inputs.basket_shell || 'true' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  msre-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # ---- 1. Restore cross-section cache --------------------------------
      # Cache each library independently so VIII.0/VII.1/JEFF-3.3 don't
      # evict each other. We only restore the library being used in this
      # run (path is scoped to that subdir), so a single cache survives
      # within GHA's 10 GB-per-repo budget.
      - name: Resolve library paths
        id: xs-paths
        env:
          XS_LIB: ${{ github.event.inputs.xs_library || 'endfb-viii.0' }}
        run: |
          XS_LIB="${XS_LIB:-endfb-viii.0}"
          case "$XS_LIB" in
            endfb-viii.0) DIRNAME="endfb-viii.0-hdf5" ;;
            endfb-vii.1)  DIRNAME="endfb-vii.1-hdf5" ;;
            jeff-3.3)     DIRNAME="jeff-3.3-hdf5" ;;
            *) echo "Unknown xs_library: $XS_LIB"; exit 1 ;;
          esac
          echo "xs_lib=$XS_LIB" >> "$GITHUB_OUTPUT"
          echo "xs_dirname=$DIRNAME" >> "$GITHUB_OUTPUT"
          echo "xs_xml=data/xs/$DIRNAME/cross_sections.xml" >> "$GITHUB_OUTPUT"

      - name: Cache cross-section library
        id: xs-cache
        uses: actions/cache@v4
        with:
          path: data/xs/${{ steps.xs-paths.outputs.xs_dirname }}
          # Bump the version suffix to invalidate the cache.
          key: ${{ steps.xs-paths.outputs.xs_dirname }}-v1

      - name: Fetch cross-sections (if cache miss)
        if: steps.xs-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch_xs.sh ${{ steps.xs-paths.outputs.xs_lib }}

      - name: Confirm cross-sections present and make them container-readable
        run: |
          ls -lh ${{ steps.xs-paths.outputs.xs_xml }}
          echo "XS dir size: $(du -sh data/xs | cut -f1)"
          echo "XS library: ${{ steps.xs-paths.outputs.xs_lib }}"
          # The Docker container runs as mambauser (non-root). Ensure the
          # mounted XS tree is world-readable and dirs are world-executable.
          sudo chmod -R a+rX data/xs
          # Also ensure the working tree is writeable so OpenMC can write
          # statepoint files back to the host through the bind mount.
          mkdir -p sims/openmc out out/plots out/plot_run
          sudo chmod -R a+rwX sims out

      # ---- 2. Build Docker image (with layer cache) -----------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Promethea image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: promethea:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 3a. Geometry plot mode (no simulation) -------------------------
      - name: Generate geometry plots
        if: ${{ github.event.inputs.mode == 'plot' }}
        env:
          XS_XML: ${{ steps.xs-paths.outputs.xs_xml }}
        run: |
          mkdir -p out/plots
          docker run --rm \
            -v $PWD:/workspace \
            -e OPENMC_CROSS_SECTIONS=/workspace/$XS_XML \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python benchmarks/msre/plot_geometry.py 2>&1 | tee out/plot_geometry.log
          ls -lh out/plots/

      # ---- 3b. Run the MSRE benchmark (simulation modes) ------------------
      - name: Run MSRE benchmark
        if: ${{ github.event.inputs.mode != 'plot' }}
        id: run
        env:
          PARTICLES: ${{ github.event.inputs.particles || '50000' }}
          BATCHES: ${{ github.event.inputs.batches || '120' }}
          MODE: ${{ github.event.inputs.mode || 'homog' }}
          BORON_PPM: ${{ github.event.inputs.boron_ppm || '0.3' }}
          FILLET_R: ${{ github.event.inputs.fillet_radius_cm || '0.0' }}
          XS_XML: ${{ steps.xs-paths.outputs.xs_xml }}
          XS_LIB: ${{ steps.xs-paths.outputs.xs_lib }}
          BASKET_SHELL: ${{ github.event.inputs.basket_shell || 'true' }}
        run: |
          mkdir -p out
          docker run --rm \
            -v $PWD:/workspace \
            -e OPENMC_CROSS_SECTIONS=/workspace/$XS_XML \
            -e PROMETHEA_PARTICLES=$PARTICLES \
            -e PROMETHEA_BATCHES=$BATCHES \
            -e PROMETHEA_MODE=$MODE \
            -e PROMETHEA_BORON_PPM=$BORON_PPM \
            -e PROMETHEA_FILLET_RADIUS_CM=$FILLET_R \
            -e PROMETHEA_XS_LIBRARY=$XS_LIB \
            -e PROMETHEA_BASKET_SHELL=$BASKET_SHELL \
            -e HOME=/tmp \
            -w /workspace \
            promethea:ci \
            python benchmarks/msre/run_criticality.py 2>&1 | tee out/msre_run.log

      # ---- 4. Surface results in the GitHub UI ----------------------------
      - name: Extract k-eff and write summary
        if: ${{ always() && github.event.inputs.mode != 'plot' }}
        run: |
          {
            echo "## MSRE benchmark — results"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA:0:7}\`"
            echo "**Mode:** ${{ github.event.inputs.mode || 'homog' }}"
            echo "**Particles/batch:** ${{ github.event.inputs.particles || '50000' }}"
            echo "**Batches:** ${{ github.event.inputs.batches || '120' }}"
            echo "**CGB boron (ppm):** ${{ github.event.inputs.boron_ppm || '0.3' }}"
            echo "**Fillet radius (cm):** ${{ github.event.inputs.fillet_radius_cm || '0.0' }}"
            echo "**Cross-section library:** \`${{ github.event.inputs.xs_library || 'endfb-viii.0' }}\`"
            echo "**Basket INOR-8 shell:** \`${{ github.event.inputs.basket_shell || 'true' }}\`"
            echo ""
            echo "### k-eff"
            echo '```'
            grep -E "(k-eff|k-effective|PASS|FAIL|Final k|combined)" out/msre_run.log | tail -20 || echo "(no k-eff lines found — see artifact)"
            echo '```'
            echo ""
            echo "### Tail of run log"
            echo '```'
            tail -40 out/msre_run.log
            echo '```'
            echo ""
            echo "### Acceptance envelopes"
            echo "- v0 (homogenized) envelope: \`1.00 <= k <= 1.15\`"
            echo "- v1 (heterogeneous, IRPhE salt, rods withdrawn) envelope: \`0.98 <= k <= 1.05\`, target \`~1.020\`"
            echo "- v1c (het + edge-stringer clipping) envelope: \`0.98 <= k <= 1.05\`, target \`~1.020\`"
            echo "- IRPhE experimental k-eff: \`0.99978\` (rods inserted to critical)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msre-${{ github.event.inputs.mode || 'homog' }}-${{ github.event.inputs.xs_library || 'endfb-viii.0' }}-run-${{ github.run_number }}
          path: |
            out/
            sims/openmc/msre_*/statepoint.*.h5
            sims/openmc/msre_*/tallies.out
            sims/openmc/msre_*/summary.h5
          if-no-files-found: warn
          retention-days: 30
